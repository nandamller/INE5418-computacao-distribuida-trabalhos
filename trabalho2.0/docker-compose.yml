# Sistema distribuído de reserva de assentos de avião (consenso via Viewstamped
# Replication). process1/2/3 são os terminais (réplicas) do cluster; o coordenador
# (primário) inicial é o 6061. Dois profiles de demonstração:
#   --profile simulation     -> passageiros concorrentes (cenário normal)
#   --profile election-test  -> falha do líder + eleição + recuperação (cenário de falha)
services:
  # Terminal coordenador inicial (primário) do cluster de reserva.
  process1:
    build:
      context: .
      dockerfile: process/Dockerfile
    container_name: process1
    hostname: process1
    command: python process/process1.py
    environment:
      - HOST=0.0.0.0
      - PORT=6061
      - PROCESS_ID=1
      - CLUSTER_TOPOLOGY={"6061":["process1",7061],"6062":["process2",7062],"6063":["process3",7063]}
      - PRIMARY_ID=6061
      - PYTHONUNBUFFERED=1
    ports:
      - "7061:7061"
    networks:
      - vr-network

  process2:
    build:
      context: .
      dockerfile: process/Dockerfile
    container_name: process2
    hostname: process2
    command: python process/process2.py
    environment:
      - HOST=0.0.0.0
      - PORT=6062
      - PROCESS_ID=2
      - CLUSTER_TOPOLOGY={"6061":["process1",7061],"6062":["process2",7062],"6063":["process3",7063]}
      - PRIMARY_ID=6061
      - PYTHONUNBUFFERED=1
    ports:
      - "7062:7062"
    networks:
      - vr-network

  process3:
    build:
      context: .
      dockerfile: process/Dockerfile
    container_name: process3
    hostname: process3
    command: python process/process3.py
    environment:
      - HOST=0.0.0.0
      - PORT=6063
      - PROCESS_ID=3
      - CLUSTER_TOPOLOGY={"6061":["process1",7061],"6062":["process2",7062],"6063":["process3",7063]}
      - PRIMARY_ID=6061
      - PYTHONUNBUFFERED=1
    ports:
      - "7063:7063"
    networks:
      - vr-network

  client-simulator:
    build:
      context: .
      dockerfile: process/Dockerfile
    container_name: client-simulator
    command: python process/client_simulator.py
    environment:
      - CLUSTER_TOPOLOGY={"6061":["process1",7061],"6062":["process2",7062],"6063":["process3",7063]}
      - NUM_CLIENTS=3
      - OPS_PER_CLIENT=20
      - MIN_THINK_TIME=0.5
      - MAX_THINK_TIME=2.0
      - REQUEST_TIMEOUT=3.0
      - PYTHONUNBUFFERED=1
    depends_on:
      - process1
      - process2
      - process3
    networks:
      - vr-network
    profiles:
      - simulation

  election-test:
    build:
      context: .
      dockerfile: process/Dockerfile
    container_name: election-test
    command: python process/election_test_client.py
    environment:
      - CLUSTER_TOPOLOGY={"6061":["process1",7061],"6062":["process2",7062],"6063":["process3",7063]}
      - PYTHONUNBUFFERED=1
    depends_on:
      - process1
      - process2
      - process3
    networks:
      - vr-network
    profiles:
      - election-test

networks:
  vr-network:
    driver: bridge